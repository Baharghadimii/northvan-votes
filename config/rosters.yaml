# Members seated during the 2022-2026 term, per municipality.
#
# Two jobs:
#   1. Flag incumbents among the 2026 candidates.
#   2. Resolve bare surnames in council minutes ("Opposed: Councillors BACK and
#      POPE") to one specific person.
#
# Surnames collide ACROSS municipalities (BACK and BELL both appear in each), so
# resolution is always scoped to one roster. Never merge these lists.
#
# If a surname in the minutes is not listed here the build fails loudly rather
# than guessing -- which is also how a mid-term appointment or byelection winner
# we missed would surface. Do not "fix" such a failure by loosening matching;
# add the member here after confirming from the minutes.

