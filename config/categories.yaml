# Cross-cutting, named local flashpoints. These are not categories; an item or
# quote can carry a flashpoint tag and a category tag at once. Matching is by
# exact phrase because the value here is precision, not recall.
flashpoints:
  - id: wastewater-treatment-plant
    label: North Shore Wastewater Treatment Plant
    description: >-
      The Metro Vancouver plant whose cost estimate rose from roughly $700M in
      2013 to $3.86B by 2024, and the share North Shore taxpayers carry.
    phrases:
      - wastewater treatment plant
      - wastewater plant
      - north shore wastewater
      - treatment plant

  - id: harry-jerome
    label: Harry Jerome Community Recreation Centre
    phrases:
      - harry jerome

  - id: amalgamation
    label: Amalgamation / reunification
    description: >-
      Whether the City and District should merge. The District maintains a
      standing "Reunification" file.
    phrases:
      - amalgamation
      - amalgamate
      - reunification
      - reunify

  - id: third-crossing
    label: A third crossing / new bridge
    phrases:
      - third crossing
      - new crossing
      - second narrows
      - ironworkers memorial
      - new bridge

  - id: spirit-trail
    label: Spirit Trail
    phrases:
      - spirit trail

# Biographical background, extracted the same way as positions: the model picks
# sentences, the code cuts the characters. Candidates write a lot about who they
# are and what they have done, and until now all of it was discarded — which
# left people whose statement is a biography rather than a platform looking as
# though they had said nothing at all.
background:
  - id: public-office
    label: Public office & committees
    description: >-
      Elected or appointed roles: council, school board, advisory committees,
      commissions, other levels of government.
