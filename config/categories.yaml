# Issue taxonomy.
#
# SEED ONLY. These ten came from a frequency pass over the 48 official candidate
# statements (see pipeline/topics.py). Release 2 re-derives and re-ranks them
# from four years of council minutes, so expect this file to change once the
# minutes pipeline runs. Ranking on the site is by council activity, never by
# the order written here.
#
# `keywords` do NOT decide what gets published. They narrow which passages are
# worth sending to the tagger and act as a fallback when no API key is present.
# Every published quote is a validated verbatim span -- see pipeline/models.py.

