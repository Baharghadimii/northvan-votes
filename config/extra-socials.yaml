# Campaign channels the municipalities' candidate pages do not list.
#
# The District publishes some of a candidate's links and not others. Kulvir
# Mann's personal Facebook profile is listed there, but the page he actually
# campaigns from is not, so the official listing pointed readers at the less
# useful of his two. Same situation as the missing website links.
#
# Offered to every candidate, not only the ones who think to ask, and recorded
# here with where it came from. /methodology says so in public.
#
# Only channels for THIS election. Kulvir Mann also runs a school trustee page
# from his 2022 run; he is a council candidate in 2026, and linking it would
# imply a candidacy that does not exist, so it is deliberately absent.

- name: Kulvir Mann
  id: dnv-council-mann-kulvir
  key: facebook_campaign
  url: https://www.facebook.com/people/Elect-Kulvir-Mann-for-District-of-North-Vancouver-Councillor/61593685499934/
  source: supplied by the candidate, 2026-10-05

# The District's election page lists facebook.com/Mike4DNVMayor as his website.
# It does not load -- Facebook reports the content unavailable -- so the sitting
# mayor's only official link was dead. This profile is his and does load. Still
# not scraped, like every Facebook link here, but a reader clicking through now
# reaches him instead of an error.
- name: Mike Little
  id: dnv-mayor-little-mike
  key: facebook
  url: https://www.facebook.com/mike.little.121
  source: >-
    located 2026-10-05 after the address the District publishes stopped
    resolving; verified as his (1.8K followers, listed as Mayor at North
    Vancouver District)
