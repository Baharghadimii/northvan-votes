# Campaign websites that the municipalities' own candidate pages do not list.
#
# The District in particular publishes a website link for only some candidates,
# so people with a real campaign site — including the sitting mayor and three
# sitting councillors — appeared here with none. That made them look quieter
# than they are, which is the opposite of what this site is for.
#
# Sources are recorded per entry because these did not come from the official
# page, and /methodology says so.
#
#   crawl: false  -> show the link to readers, but do not read it
#                    (a Facebook page behind a login, or a site in maintenance)

