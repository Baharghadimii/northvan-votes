# in to say they had no profile here and nobody had told them the site existed.
# Both were running campaign sites the District never listed.
- name: Laura Nickerson
  url: https://lauranickerson.com
  source: the candidate's own VoteMate profile
# Layne North's VoteMate profile lists votenorth.nationbuilder.com. It was
# added here on 2026-10-16 and taken out again the same evening: opened in a
# browser it redirects to a NationBuilder signup form, titled "Your nation",
# carrying the banner "This site uses demo content for illustrative purposes
# only". It is an unconfigured template, not a published campaign site, so
# linking it would send a voter to a signup form the night before the vote.
