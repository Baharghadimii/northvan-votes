- vote_id: cnv-R2026-11-16/7
  municipality: cnv
  date: '2026-11-16'
  title: Service Standards and Public Reporting for Building Permits and Business Licences
  result: Carried
  minutes: https://www.cnv.org/-/media/City-of-North-Vancouver/Documents/Council-Meeting-Minutes/2026/2026-11-16-Regular-Council-Meeting-Minutes-November-16-2026.pdf#page=5
  official_text: 'WHEREAS the City is responsible for regulating building construction and
    licensing businesses under the Community Charter, and for many residents, builders and
    business owners, the permitting and licensing process is among their most direct interactions
    with City Hall;

    WHEREAS timely, predictable and transparent approval processes are essential to providing
    excellent public service, reducing costs, carrying charges and uncertainty for applicants,
    and supporting the delivery of housing, commercial space and employment opportunities
    envisioned in the City''s Official Community Plan;

    WHEREAS clear application requirements, established processing timelines and accessible
    information about application status can improve the applicant experience, reduce incomplete
    and repeat submissions, and support greater efficiency and accountability in municipal
    service delivery;

    WHEREAS municipalities that establish service standards, measure and publicly report on
    performance, and provide applicants with clear information about the progress of their
    applications can strengthen transparency, improve service delivery and build public confidence;

    WHEREAS establishing measurable service standards and regularly reporting on performance
    will better equip Council to assess service levels, identify opportunities for improvement,
    make informed decisions about staffing, resources and fees, and mitigate the economic
    and reputational risks associated with unpredictable approval timelines;

    THEREFORE BE IT RESOLVED THAT Council direct staff to report back by the end of the second
    quarter of 2027 with the following:

    1. Current Processing Times: An assessment of current processing times for building permits
    and business licences, broken down by application category and type, establishing a baseline
    that measures both the total elapsed time from application submission to final decision
    and the time attributable to active City review, applicant responses and external agency
    requirements;

    2. Proposed Service Standards: Recommended processing time standards for each permit and
    licence category, expressed in business days, weeks or months, with clear definitions
    of when processing timelines begin, pause and resume, including a same-day or next-business-day
    service standard for low-risk business licences and renewals that do not require inspections
    or referrals;

    3. Clear Application Requirements: Plain-language application requirements for each permit
    and licence category, supported by accessible checklists and pre-application guidance,
    to ensure applicants understand what is required before submitting an application and
    to help reduce incomplete and repeat submissions;

    4. Application Status Transparency: A proposed approach and implementation timeline to
    enable applicants to track the progress of their applications, including the current stage
    of review, outstanding requirements and the party responsible for addressing them, and
    an anticipated completion date, with proactive notification when delays occur;

    5. Public Performance Reporting: A proposed framework and implementation timeline for
    publicly reporting the City''s performance against established service standards on its
    website, at least quarterly, including both total elapsed application timelines and City
    processing times, with delays attributable to applicants or external agencies identified
    separately, to strengthen transparency, accountability and continuous service improvement;

    6. Regulatory and Process Improvements: Recommended amendments, where necessary, to the
    Construction Regulation Bylaw, Business Licence Bylaw and applicable fee bylaws, together
    with measures to streamline processes, reduce incomplete and repeat applications, and
    support the achievement of established service standards;

    AND THAT, following Council''s adoption of service standards, staff report annually on
    the City''s performance against those standards, including overall application timelines,
    the reasons for variances, opportunities for service improvement and recommended adjustments
    to ensure the standards remain effective, achievable and responsive to community needs.'
  municipality_categories: []
  category_hints: []
  proposed_issues:
  - development-and-growth
  - governance-and-transparency
  proposal_reason: The motion directs staff to set processing-time standards and publicly
    report performance on building permits and business licences, which bears on permitting
    speed (development) and on openness and accountability (governance).
  issues:
  - development-and-growth
  - governance-and-transparency
  summary: Directed staff to report by mid-2027 on building permit and business licence processing
    times, proposed service standards, application tracking and public performance reporting.
  votes:
